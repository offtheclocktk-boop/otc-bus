# Optional: wake {{AGENT_A}} by POSTing to a webhook when a message PR is opened.
# Use this only if {{AGENT_A}}'s platform does not already offer a native
# "pull request opened" trigger for this repo.
#
# Setup (repo Settings > Secrets and variables > Actions):
#   AGENT_A_WAKE_URL    required  HTTPS endpoint that starts {{AGENT_A}}
#   AGENT_A_WAKE_TOKEN  optional  sent as "Authorization: Bearer <token>"
name: Wake {{AGENT_A}}

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'messages/for-{{AGENT_A}}/**'

permissions: {}

jobs:
  wake:
    if: startsWith(github.event.pull_request.title, '[for-{{AGENT_A}}]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify {{AGENT_A}}
        env:
          WAKE_URL: ${{ secrets.AGENT_A_WAKE_URL }}
          WAKE_TOKEN: ${{ secrets.AGENT_A_WAKE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$WAKE_URL" ]; then
            echo "AGENT_A_WAKE_URL is not set; nothing to do."
            exit 0
          fi
          payload=$(jq -n --arg repo "$REPO" --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" --arg url "$PR_URL" \
            '{event: "inbox.message", recipient: "{{AGENT_A}}", repo: $repo, number: $number, title: $title, url: $url}')
          headers=(-H "Content-Type: application/json")
          if [ -n "$WAKE_TOKEN" ]; then headers+=(-H "Authorization: Bearer $WAKE_TOKEN"); fi
          curl -fsS --max-time 30 -X POST "${headers[@]}" --data "$payload" "$WAKE_URL"
